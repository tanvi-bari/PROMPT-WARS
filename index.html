<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>City Life – Explore, compare, stay safe</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--bg:#eef2f1;--card:#fff;--ink:#14232b;--mut:#5b6b72;--line:#d5dedd;--acc:#0f766e;--risk:#d9480f;--route:#1d4ed8;--map:#e3ebe8;--water:#bcd7e6;--road:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme="light"]){}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a1f;--card:#16262d;--ink:#e6eeee;--mut:#9ab0b6;--line:#26404a;--acc:#2dd4bf;--risk:#fb923c;--route:#7aa2ff;--map:#14262d;--water:#1f4152;--road:#223b45}}
:root[data-theme="dark"]{--bg:#0e1a1f;--card:#16262d;--ink:#e6eeee;--mut:#9ab0b6;--line:#26404a;--acc:#2dd4bf;--risk:#fb923c;--route:#7aa2ff;--map:#14262d;--water:#1f4152;--road:#223b45}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,sans-serif}
h1,h2,h3{font-family:'Bricolage Grotesque',Inter,sans-serif;margin:0}
header{padding:14px 16px 0;max-width:1200px;margin:auto}
.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline}
h1{font-size:26px}.sub{color:var(--mut);font-size:13px}
.strip{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.strip span{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:4px 12px;font-size:13px}
.strip .warn{border-color:var(--risk);color:var(--risk)}
nav{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line)}
nav button{background:none;border:0;padding:10px 14px;font:600 14px Inter;color:var(--mut);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav button.on{color:var(--ink);border-color:var(--acc)}
main{max-width:1200px;margin:auto;padding:14px 16px 30px;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(320px,1fr);gap:16px}
@media(max-width:820px){main{grid-template-columns:1fr}}
.mapwrap{background:var(--map);border:1px solid var(--line);border-radius:14px;overflow:hidden;position:sticky;top:8px;align-self:start}
@media(max-width:820px){.mapwrap{position:static}}
svg{display:block;width:100%;height:auto;max-height:78vh}
.legend{display:flex;gap:10px;flex-wrap:wrap;padding:8px 12px;font-size:12px;color:var(--mut);background:var(--card);border-top:1px solid var(--line)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}
.panel{display:flex;flex-direction:column;gap:12px;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:5px 12px;cursor:pointer;font:500 13px Inter}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:10px 14px;font:600 14px Inter;cursor:pointer}
.btn.alt{background:none;color:var(--ink);border:1px solid var(--line)}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}
.item{display:flex;gap:10px;align-items:center;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);cursor:pointer;text-align:left;width:100%;color:var(--ink);font:inherit}
.item.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.dot{width:11px;height:11px;border-radius:50%;flex:none}
.score{font:700 16px 'Bricolage Grotesque';min-width:34px;text-align:right}
.bar{height:7px;background:var(--line);border-radius:4px;overflow:hidden}.bar b{display:block;height:100%}
.m{display:grid;grid-template-columns:96px 1fr 30px;gap:8px;align-items:center;font-size:13px;margin:5px 0}
.big{font:700 40px/1 'Bricolage Grotesque'}
.mut{color:var(--mut);font-size:13px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}td.best{font-weight:700;color:var(--acc)}
.wrap{overflow-x:auto}
.tag{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:1px 7px;font-size:12px;margin:2px 3px 0 0}
.ok{color:var(--acc);font-weight:600}.no{color:var(--risk);font-weight:600}
label{font-size:13px;font-weight:600;display:block;margin:8px 0 4px}
.landing{display:block}.landing .mapwrap{display:none}.landing .panel{max-width:960px;margin:auto}
.hero{background:var(--ink);color:var(--bg);border-radius:14px;padding:28px 24px}.hero h1{font-size:38px}.hero h2{font-size:22px;line-height:1.2;margin:8px 0;max-width:640px}.hero p{margin:6px 0 16px;opacity:.85;max-width:620px}
.hero .btn{background:var(--bg);color:var(--ink)}.hero .btn.alt{background:none;color:var(--bg);border:1px solid var(--bg)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}.stat b{display:block;font:700 26px 'Bricolage Grotesque'}.stat span{font-size:12px;color:var(--mut)}
.feats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:8px}
@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}.feats,.steps{grid-template-columns:1fr}.hero h1{font-size:30px}}
@keyframes up{from{opacity:0;transform:translateY(12px)}}
@keyframes pop{from{opacity:0;transform:scale(.1)}}
@keyframes grow{from{width:0}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pulse{50%{opacity:.45}}
#panel.anim>*{animation:up .45s cubic-bezier(.2,.7,.3,1) backwards}
#panel.anim>*:nth-child(2){animation-delay:.07s}#panel.anim>*:nth-child(3){animation-delay:.14s}#panel.anim>*:nth-child(4){animation-delay:.21s}#panel.anim>*:nth-child(5){animation-delay:.28s}#panel.anim>*:nth-child(n+6){animation-delay:.35s}
#map.anim g[data-id]{transform-box:fill-box;transform-origin:center;animation:pop .45s cubic-bezier(.2,1.5,.4,1) backwards;animation-delay:var(--d)}
#map.anim .rl{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1s ease .1s forwards}
.anim .bar b{animation:grow .8s cubic-bezier(.2,.7,.3,1) backwards}
.hz{animation:pulse 3.2s ease-in-out infinite}
.item,.chip,.btn{transition:transform .15s,box-shadow .15s,background .15s}.item:hover{transform:translateY(-2px);box-shadow:0 4px 10px rgba(0,0,0,.08)}.btn:hover,.chip:hover{transform:translateY(-1px)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.rl{stroke-dasharray:none!important;stroke-dashoffset:0!important}}
</style></head><body>
<header>
 <div class="top"><div><h1>City Life</h1><div class="sub">Explore, compare and stay safe. <span id="cnote">Sample data for the MVP.</span></div></div>
 <span><select id="city" aria-label="Choose city" style="width:auto;margin-right:8px"></select><button class="chip" id="theme">Toggle theme</button></span></div>
 <div class="strip"><span>29°C, humid</span><span class="warn">Rain likely after 5 PM</span><span class="warn">Heavy traffic: Station Road</span><span class="mut" style="border:0;background:none">Weather and traffic are simulated</span></div>
 <nav id="nav"></nav>
</header>
<main><div class="mapwrap"><div id="map"></div><div class="legend" id="legend"></div></div><div class="panel" id="panel"></div></main>
<script>
const CAT={food:['Food','#b45309'],stay:['Stay','#7c3aed'],sight:['Sights','#0e7490'],heritage:['Heritage','#9a3412']};
const W={s:.30,c:.20,a:.20,r:.15,x:.15},LBL={s:'Safety',c:'Cleanliness',a:'Affordability',r:'Rating',x:'Accessibility'};
let P=[
[1,'Citadel Fort','heritage',18,16,[78,70,80,86,60],'Hill fort built by the old city rulers. Sunrise views over the river.',['history','views']],
[2,'Old Town Thali House','food',30,38,[70,66,92,88,75],'Family-run thali place, lunch rush at 1 PM.',['budget','local food']],
[3,'Spice Lane Chaat Stall','food',40,28,[64,50,96,84,70],'Street snacks lane, great value but busy.',['budget','crowded']],
[4,'Heritage Stepwell','heritage',12,48,[72,74,95,80,50],'Stone stepwell with carved arches, free entry. Rough path to reach it.',['history','free']],
[5,'Riverside Café','food',52,50,[84,88,60,90,85],'Calm café on the river walk. Good for evenings.',['clean','quiet']],
[6,'Central Station Lodge','stay',68,26,[48,55,85,62,95],'Cheap rooms next to the station. Noisy and poorly lit at night.',['budget','noisy']],
[7,'Market Square Hostel','stay',44,64,[70,78,88,82,80],'Social hostel close to markets and buses.',['budget','social']],
[8,'Grand Palace Hotel','stay',80,52,[92,94,30,91,90],'Premium hotel with 24x7 security.',['luxury','safe']],
[9,'City Museum','sight',58,14,[88,90,75,87,88],'Art and local history galleries. Closed Mondays.',['culture','indoor']],
[10,'Lakeview Garden','sight',74,76,[80,72,98,78,65],'Free garden with a walking loop. Best before sunset.',['free','outdoor']],
[11,'Night Bazaar','sight',30,72,[52,45,90,79,72],'Lively evening market. Watch your belongings.',['crowded','shopping']],
[12,'Tech Park Food Court','food',88,22,[86,85,70,76,82],'Clean, quick lunches with many options.',['clean','quick']],
[13,'Old Temple Complex','heritage',20,62,[82,80,98,89,68],'Centuries-old temple with an annual lantern festival.',['tradition','free']],
[14,'Harbor Gate Grill','food',56,86,[66,70,65,81,60],'Seafood grill beside a busy junction.',['seafood','traffic']],
[15,'Riverfront Promenade','sight',44,48,[85,80,98,84,90],'Paved walk along the river with benches and lights.',['free','walk']],
[16,'Sunrise Bakery','food',24,52,[74,82,85,86,70],'Fresh bread and chai from 6 AM.',['breakfast','budget']],
[17,'Pearl Boutique Hotel','stay',34,22,[88,90,55,89,78],'Restored townhouse hotel with a quiet courtyard.',['safe','quiet']],
[18,'Textile Museum','heritage',8,30,[76,80,72,80,70],'Hand-block printing and weaving traditions, with live demos.',['craft','culture']],
[19,'Street Food Alley','food',70,60,[60,52,97,85,65],'Evening stalls with local snacks. Busy after 7 PM.',['budget','crowded']],
[20,'Botanical Park','sight',84,88,[84,86,99,83,75],'Large shaded park with a lake and cycle track.',['free','outdoor']],
[21,'Bus Terminal Dhaba','food',78,36,[58,48,93,70,85],'Cheap and fast meals next to the bus terminal.',['budget','late-night']],
[22,'Backpackers Nest','stay',14,80,[68,74,92,80,60],'Dorm beds and a rooftop common room.',['budget','social']],
[23,'Clock Tower','heritage',40,12,[86,84,98,85,80],'19th-century clock tower at the old market gate.',['history','free']],
[24,'Skyline Rooftop Grill','food',62,58,[78,86,35,88,88],'Rooftop dining with city views. Pricey.',['views','premium']],
[25,'Craft Market','sight',50,40,[72,66,85,80,78],'Handicraft stalls, best on weekend mornings.',['shopping','local']]
].map(a=>({id:a[0],name:a[1],cat:a[2],x:a[3],y:a[4],b:{s:a[5][0],c:a[5][1],a:a[5][2],r:a[5][3],x:a[5][4]},blurb:a[6],tags:a[7]}));
let E=[[1,2],[2,3],[2,4],[4,13],[13,11],[2,5],[3,6],[3,9],[9,6],[9,12],[6,12],[6,8],[5,6],[5,7],[5,8],[7,11],[7,14],[11,14],[14,10],[8,10],[23,3],[23,9],[17,2],[17,23],[18,1],[18,4],[16,4],[16,2],[15,5],[15,2],[25,3],[25,15],[19,8],[19,24],[24,5],[24,19],[20,10],[21,6],[21,12],[22,13],[22,11]];
const N=()=>P,EE=()=>E;
let Z=[{x:60,y:40,r:14,w:.9,n:'Station Road underpass',why:'Poor lighting, snatching reports'},{x:36,y:62,r:12,w:.7,n:'Night Bazaar lane',why:'Crowding, pickpocket reports'},{x:66,y:70,r:12,w:.8,n:'Harbor Gate junction',why:'Accident-prone, no crossing'}];
const STORY=[['Citadel Fort','Built to watch the river trade, its gates still close each evening.'],['Heritage Stepwell','Stepwells stored monsoon water and were also community meeting spots.'],['Old Temple Complex','Lantern festival each autumn lights the whole complex.']];
let R=[
{id:1,cat:'Poor lighting',text:'Streetlights out under the station underpass.',x:61,y:42,hrs:3,votes:6},
{id:2,cat:'Poor lighting',text:'Very dark near the underpass after 9 PM.',x:58,y:39,hrs:20,votes:3},
{id:3,cat:'Accident',text:'Two-wheeler collision at Harbor Gate signal.',x:66,y:69,hrs:5,votes:8},
{id:4,cat:'Garbage',text:'Overflowing bins behind Night Bazaar.',x:34,y:70,hrs:30,votes:2},
{id:5,cat:'Theft',text:'Phone snatched near bazaar entrance.',x:37,y:60,hrs:10,votes:4}];
const S={anim:true,city:'pune',cname:'Pune',tab:'home',cat:'all',q:'',sel:null,cmp:[2,5],heat:false,from:1,to:8,pin:null,res:null,rid:6};
const $=id=>document.getElementById(id),pl=id=>P.find(p=>p.id==id);
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function conf(r){const n=R.filter(o=>o!==r&&o.cat===r.cat&&Math.hypot(o.x-r.x,o.y-r.y)<10).length;return Math.min(100,Math.round(25+n*18+r.votes*4+Math.max(0,20-r.hrs*.7)))}
const zs=()=>[...Z,...R.map(r=>({x:r.x,y:r.y,r:9,w:.15+.45*conf(r)/100}))];
function inten(x,y){let t=0;zs().forEach(z=>{t+=z.w*Math.max(0,1-Math.hypot(x-z.x,y-z.y)/z.r)});return Math.min(1,t)}
function sc(p){const b={...p.b};b.s=Math.round(b.s*(1-.5*inten(p.x,p.y)));const t=Math.round(Object.keys(W).reduce((s,k)=>s+b[k]*W[k],0));return{...b,t}}
const col=v=>v>=75?'#15803d':v>=55?'#ca8a04':'#d9480f';
function eRisk(a,b){let t=0;for(let i=0;i<=8;i++)t+=inten(a.x+(b.x-a.x)*i/8,a.y+(b.y-a.y)*i/8);return t/9}
function route(f,t,safe){const d={},prev={},seen={};N().forEach(p=>d[p.id]=1e9);d[f]=0;
 for(;;){let u=null;N().forEach(p=>{if(!seen[p.id]&&(u===null||d[p.id]<d[u]))u=p.id});if(u===null||d[u]>=1e9||u==t)break;seen[u]=1;
  EE().forEach(([a,b])=>{let v=a==u?b:b==u?a:null;if(v===null)return;const A=pl(u),B=pl(v),c=dist(A,B)*(safe?1+7*eRisk(A,B):1);if(d[u]+c<d[v]){d[v]=d[u]+c;prev[v]=u}})}
 const path=[t];while(path[0]!=f&&prev[path[0]]!==undefined)path.unshift(prev[path[0]]);let len=0,ex=0;
 for(let i=0;i<path.length-1;i++){const A=pl(path[i]),B=pl(path[i+1]),l=dist(A,B);len+=l;ex+=l*eRisk(A,B)}
 return{path,km:(len*.12).toFixed(1),min:Math.round(len*.12/20*60),safety:Math.round(100*(1-Math.min(1,ex/len*1.6)))}}
function summary(p){const s=sc(p),ks=Object.keys(LBL).map(k=>k).sort((a,b)=>s[b]-s[a]);
 const adv=s.s<60?'Avoid after 9 PM or go in a group.':s.s<75?'Fine in daytime; stay alert at night.':'Safe at most hours.';
 return `Best for ${LBL[ks[0]].toLowerCase()} and ${LBL[ks[1]].toLowerCase()}. Weakest on ${LBL[ks[4]].toLowerCase()}. ${adv}`}
function nearReports(p){return R.filter(r=>Math.hypot(r.x-p.x,r.y-p.y)<14)}
function shown(){return P.filter(p=>(S.cat==='all'||p.cat===S.cat)&&p.name.toLowerCase().includes(S.q.toLowerCase()))}
function bars(s){return Object.keys(LBL).map(k=>`<div class="m"><span>${LBL[k]}</span><div class="bar"><b style="width:${s[k]}%;background:${col(s[k])}"></b></div><b>${s[k]}</b></div>`).join('')}
/* MAP */
function mapSvg(){let g=`<svg viewBox="0 0 100 100" id="svg" role="img" aria-label="Map of ${S.cname}"><defs><radialGradient id="hg"><stop offset="0" stop-color="#d9480f" stop-opacity=".6"/><stop offset="1" stop-color="#d9480f" stop-opacity="0"/></radialGradient></defs>
<rect width="100" height="100" fill="var(--map)"/><path d="M0 40 C25 30 40 55 60 45 S90 40 100 48 L100 56 C90 50 70 52 60 52 S25 38 0 48Z" fill="var(--water)" opacity=".8"/>`;
 EE().forEach(([a,b])=>{const A=pl(a),B=pl(b);g+=`<line x1="${A.x}" y1="${A.y}" x2="${B.x}" y2="${B.y}" stroke="var(--road)" stroke-width="1.6" stroke-linecap="round"/>`});
 if(S.heat||S.tab==='safety')zs().forEach(z=>g+=`<circle class="hz" cx="${z.x}" cy="${z.y}" r="${z.r}" fill="url(#hg)"/>`);
 if(S.tab==='safety')R.forEach(r=>g+=`<path d="M${r.x} ${r.y-2.2}l2 3.6h-4z" fill="#d9480f" stroke="#fff" stroke-width=".4"><title>${r.cat}: ${r.text}</title></path>`);
 if(S.tab==='route'&&S.res){[[S.res.fast,'#64748b',''],[S.res.safe,'var(--route)','']].forEach(([r,c],i)=>{const pts=r.path.map(id=>pl(id).x+','+pl(id).y).join(' ');g+=`<polyline points="${pts}" fill="none" stroke="${c}" stroke-width="${i?1.6:1.2}" stroke-dasharray="${i?'':'2 1.4'}" ${i?'pathLength="1" class="rl"':''} stroke-linecap="round" stroke-linejoin="round"/>`})}
 const list=P;
 list.forEach(p=>{const dim=(S.tab==='explore'&&!shown().includes(p))||(S.tab==='heritage'&&p.cat!=='heritage');const on=S.sel==p.id||(S.tab==='compare'&&S.cmp.includes(p.id))||(S.tab==='route'&&(p.id==S.from||p.id==S.to));
  g+=`<g data-id="${p.id}" style="cursor:pointer;--d:${P.indexOf(p)*30}ms" opacity="${dim?.2:1}"><circle cx="${p.x}" cy="${p.y}" r="${on?3.4:2.5}" fill="${CAT[p.cat][1]}" stroke="${on?'var(--ink)':'#fff'}" stroke-width=".7"/><title>${p.name}</title>${on?`<text x="${p.x}" y="${p.y-4.2}" font-size="2.8" text-anchor="middle" fill="var(--ink)" font-weight="600" paint-order="stroke" stroke="var(--map)" stroke-width=".8">${p.name}</text>`:''}</g>`});
 if(S.pin)g+=`<path d="M${S.pin.x} ${S.pin.y}l-2-4.5a2.4 2.4 0 1 1 4 0z" fill="#d9480f" stroke="#fff" stroke-width=".4"/>`;
 return g+'</svg>'}
function legend(){return ''+Object.values(CAT).map(c=>`<span><i style="background:${c[1]}"></i>${c[0]}</span>`).join('')+(S.tab==='route'?'<span>Dashed grey: fastest</span><span style="color:var(--route)">Blue: safest</span>':'')+(S.tab==='safety'||S.heat?'<span style="color:var(--risk)">Red glow: reported risk</span>':'')+(S.tab==='report'?'<span>Click the map to drop a pin</span>':'')}
/* PANELS */
function detail(p){const s=sc(p),nr=nearReports(p);return `<div class="card"><div class="row"><div><h2>${p.name}</h2><span class="mut">${CAT[p.cat][0]}</span></div><div style="text-align:right"><div class="big" style="color:${col(s.t)}">${s.t}</div><div class="mut">City Score</div></div></div>
<p>${p.blurb}</p>${bars(s)}<p><b>AI summary:</b> ${summary(p)}</p><div>${p.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
<p class="mut">${nr.length?nr.length+' citizen report(s) within range lower the safety score.':'No recent reports nearby.'}</p>
<div class="row" style="flex-wrap:wrap"><button class="btn alt" data-a="cmp" data-v="${p.id}">Add to compare</button><button class="btn" data-a="routeto" data-v="${p.id}">Route here</button></div></div>`}
function pExplore(){const l=shown().map(p=>({p,t:sc(p).t})).sort((a,b)=>b.t-a.t);
 return `<input id="q" placeholder="Search places" value="${S.q}" aria-label="Search places"><div class="chips">${['all',...Object.keys(CAT)].map(c=>`<button class="chip ${S.cat===c?'on':''}" data-a="cat" data-v="${c}">${c==='all'?'All':CAT[c][0]}</button>`).join('')}</div>
<label class="row" style="margin:0"><span>Show safety layer</span><input type="checkbox" data-a="heat" ${S.heat?'checked':''} style="width:auto"></label>
${S.sel?detail(pl(S.sel)):'<div class="card mut">Select a place on the map or list to see its City Score.</div>'}
${l.length?l.map(o=>item(o.p,o.t)).join(''):'<div class="card mut">No places match. Clear the search or pick another category.</div>'}`}
function item(p,t){return `<button class="item ${S.sel==p.id?'on':''}" data-a="sel" data-v="${p.id}"><span class="dot" style="background:${CAT[p.cat][1]}"></span><span style="flex:1">${p.name}<br><span class="mut">${CAT[p.cat][0]}</span></span><span class="score" style="color:${col(t)}">${t}</span></button>`}
function pCompare(){const all=P.map(p=>({p,s:sc(p)})).sort((a,b)=>b.s.t-a.s.t),c=S.cmp.map(pl).filter(Boolean);
